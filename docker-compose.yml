services:
  github-runner:
    image: ghcr.io/ercindedeoglu/gh-runner:latest
    environment:
      - RUNNER_NAME=dind-runner
      - RUNNER_URL=https://github.com/your-org-or-repo
      - GITHUB_PAT=${GITHUB_PAT}
      - RUNNER_LABELS=docker,dind,ubuntu-latest,4cpu
    # Mount the host Docker socket if you want to leverage the host’s Docker daemon.
    # To run fully isolated DinD, set the environment variable DOCKER_SOCK to an empty
    # string or comment out the following two lines.
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    privileged: true
    restart: unless-stopped

networks:
  default:
    driver: bridge